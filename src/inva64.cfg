# Linker config of the main game file. It loads to $0400-$CBFF in one piece.
#
#   ONESHOT  $0400-$07FF  data and code used only before the first KUOLIT
#                         screen (this is the text screen after that)
#   LOW      $0800-$0FFF  entry point ($0800), VQ codebook, small data
#   MUSIC    $1000-$15B9  GoatTracker player + song (fixed address)
#   MAIN     $15BA-       code, clips, BSS; the C stack ends at $CC00
#   HIRAM    $D000-$DFFF  clips in the RAM under I/O; written to its own
#                         file, which the boot file carries and copies
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0100;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002, size = $001A;
    LOADADDR: file = %O,               start = $03FE, size = $0002;
    ONESHOT:  file = %O, define = yes, start = $0400, size = $0400, fill = yes;
    LOW:      file = %O, define = yes, start = $0800, size = $0800, fill = yes;
    MUSIC:    file = %O,               start = $1000, size = $05BA, fill = yes;
    MAIN:     file = %O, define = yes, start = $15BA, size = $CC00 - $15BA - __STACKSIZE__;
    HIRAM:    file = "build/hi.bin", define = yes, start = $D000, size = $1000;
}
SEGMENTS {
    ZEROPAGE:  load = ZP,       type = zp;
    LOADADDR:  load = LOADADDR, type = ro;
    ONESHOT:   load = ONESHOT,  type = ro;
    STARTUP:   load = LOW,      type = ro;
    CODEBOOK:  load = LOW,      type = ro;
    RODATA:    load = LOW,      type = ro;
    DATA:      load = LOW,      type = rw;
    INIT:      load = LOW,      type = rw,  optional = yes;
    ONCE:      load = LOW,      type = ro,  optional = yes;
    LOWCODE:   load = LOW,      type = ro,  optional = yes;
    MUSIC:     load = MUSIC,    type = ro;
    CODE:      load = MAIN,     type = ro;
    SAMPLES:   load = MAIN,     type = ro;
    BSS:       load = MAIN,     type = bss, define = yes;
    SAMPLESHI: load = HIRAM,    type = ro;
}
